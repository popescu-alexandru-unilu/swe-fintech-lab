
name: Main Branch Policy

on:
  pull_request:
    branches: [main]

jobs:
  verify-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != "develop" ] ||
             [ "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo "Only the develop branch of this repository may merge into main."
            exit 1
          fi

          echo "Valid PR: develop -> main"
